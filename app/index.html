<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromatic Explorer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Left panel: Palette + Picker side-by-side -->
    <div id="left-panel">
        <!-- Palette Panel -->
        <div id="palette-panel">
            <div id="palette-header">
                <h3>Saved Colors</h3>
                <div id="palette-actions" style="display:none">
                    <button id="clear-palette-btn" title="Clear saved colors">Clear</button>
                </div>
            </div>
            <div id="palette-colors">
                <span id="palette-empty">Add colors from the mixer</span>
            </div>
        </div>

        <!-- Color Picker Panel -->
        <div id="picker-panel">
            <div id="picker-header">
                <h3>Color Mixer</h3>
            </div>
            <div id="picker-body">
                <!-- Preview -->
                <div id="picker-preview-row">
                    <div id="picker-preview"></div>
                    <div id="picker-native-wrap">
                        <input type="color" id="picker-native" value="#ffffff">
                        <label>Pick</label>
                    </div>
                </div>

                <!-- Add to palette -->
                <button id="add-to-palette-btn">Save Color</button>

                <!-- HEX -->
                <div>
                    <div class="picker-section-title">Hex</div>
                    <div id="picker-hex-row">
                        <label>#</label>
                        <input type="text" id="picker-hex" value="FFFFFF" maxlength="6" spellcheck="false">
                    </div>
                </div>

                <!-- RGB -->
                <div>
                    <div class="picker-section-title">RGB</div>
                    <div class="picker-slider-row">
                        <label>R</label>
                        <input type="range" id="picker-r" min="0" max="255" value="255">
                        <input type="number" id="picker-r-num" min="0" max="255" value="255">
                    </div>
                    <div class="picker-slider-row">
                        <label>G</label>
                        <input type="range" id="picker-g" min="0" max="255" value="255">
                        <input type="number" id="picker-g-num" min="0" max="255" value="255">
                    </div>
                    <div class="picker-slider-row">
                        <label>B</label>
                        <input type="range" id="picker-b" min="0" max="255" value="255">
                        <input type="number" id="picker-b-num" min="0" max="255" value="255">
                    </div>
                </div>

                <!-- HSL -->
                <div>
                    <div class="picker-section-title">HSL</div>
                    <div class="picker-slider-row">
                        <label>H</label>
                        <input type="range" id="picker-h" min="0" max="360" value="0">
                        <input type="number" id="picker-h-num" min="0" max="360" value="0">
                    </div>
                    <div class="picker-slider-row">
                        <label>S</label>
                        <input type="range" id="picker-s" min="0" max="100" value="0">
                        <input type="number" id="picker-s-num" min="0" max="100" value="0">
                    </div>
                    <div class="picker-slider-row">
                        <label>L</label>
                        <input type="range" id="picker-l" min="0" max="100" value="100">
                        <input type="number" id="picker-l-num" min="0" max="100" value="100">
                    </div>
                </div>

                <!-- Closest Chromatic Color -->
                <div>
                    <div class="picker-section-title">Closest Chromatic Color</div>
                    <div id="closest-result" title="Click to load this color">
                        <div id="closest-swatch"></div>
                        <div id="closest-info">
                            <div id="closest-name">—</div>
                            <div id="closest-hex"></div>
                            <div id="closest-distance"></div>
                        </div>
                        <button id="closest-goto">Go to</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Center area: Grid + Neighborhood -->
    <div id="center">
        <!-- Grid Section (controls + swatches) -->
        <div id="grid-section">
            <!-- Controls -->
            <div id="controls">
                <div id="search-row">
                    <input type="text" id="search" placeholder="Search by name, hex, family…" autocomplete="off">
                    <select id="sort-select">
                        <option value="number">Original order</option>
                        <option value="alpha">Alphabetical</option>
                        <option value="hue">By hue</option>
                        <option value="lightness">By lightness</option>
                    </select>
                    <button id="clear-btn">Clear filters</button>
                    <span id="result-count"></span>
                </div>
                <div id="family-chips"></div>
            </div>
            <!-- Grid -->
            <div id="grid-scroll">
                <div id="grid">
                    <div id="loading">Loading colors…</div>
                </div>
            </div>
        </div>

        <!-- Neighborhood Explorer Panel -->
        <div id="neighborhood-panel">
            <div id="neighborhood-header">
                <h3>Nearby Colors</h3>
                <button id="neighborhood-collapse" title="Collapse panel">−</button>
            </div>
            <div id="neighborhood-body">
                <!-- Axis selectors + presets -->
                <div id="neighborhood-toolbar">
                    <div id="axis-selectors">
                        <label>X:</label>
                        <select id="axis-x">
                            <option value="r">Red</option>
                            <option value="g">Green</option>
                            <option value="b" selected>Blue</option>
                            <option value="h">Hue</option>
                            <option value="s">Saturation</option>
                            <option value="l">Lightness</option>
                        </select>
                        <label>Y:</label>
                        <select id="axis-y">
                            <option value="r" selected>Red</option>
                            <option value="g">Green</option>
                            <option value="b">Blue</option>
                            <option value="h">Hue</option>
                            <option value="s">Saturation</option>
                            <option value="l">Lightness</option>
                        </select>
                    </div>
                    <div id="axis-presets">
                        <button class="preset-btn" data-x="r" data-y="g">R-G</button>
                        <button class="preset-btn" data-x="r" data-y="b">R-B</button>
                        <button class="preset-btn" data-x="g" data-y="b">G-B</button>
                        <button class="preset-btn" data-x="h" data-y="s">H-S</button>
                        <button class="preset-btn" data-x="h" data-y="l">H-L</button>
                        <button class="preset-btn" data-x="s" data-y="l">S-L</button>
                    </div>
                </div>

                <!-- Zoom slider -->
                <div id="zoom-row">
                    <label>Zoom:</label>
                    <input type="range" id="neighborhood-zoom" min="10" max="128" value="64">
                    <span id="zoom-value">±64</span>
                </div>

                <!-- Canvas -->
                <div id="canvas-wrap">
                    <canvas id="neighborhood-canvas"></canvas>
                    <!-- Tooltip (positioned absolutely) -->
                    <div id="neighborhood-tooltip" class="hidden">
                        <div id="tooltip-swatch"></div>
                        <div id="tooltip-info">
                            <div id="tooltip-name"></div>
                            <div id="tooltip-hex"></div>
                        </div>
                    </div>
                </div>

                <!-- Crosshair info bar -->
                <div id="crosshair-bar">
                    <div id="crosshair-swatch"></div>
                    <span id="crosshair-hex">#FFFFFF</span>
                    <span id="crosshair-channels">R:255 G:255 B:255</span>
                </div>

                <!-- Nearest colors list -->
                <div id="nearest-section">
                    <div class="picker-section-title">Nearest Colors</div>
                    <div id="nearest-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
